server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/mime.types;           # стандартная таблица: html, js, css, wasm и т.д.
    default_type application/octet-stream;   # неизвестные расширения (.onnx) — бинарные данные

    location ~* \.(wasm|onnx)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location ~* \.(js|css|png|svg|woff2)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location / {
        try_files $uri /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json application/wasm;
    gzip_min_length 1024;
}
